name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build Docker Image
        run: docker build -t tp-notes:latest .

      - name: Audit des dépendances
        run: npm audit --audit-level=high || true

      - name: Génération du SBOM
        run: npm list --json > sbom.json

      - name: Utilisation sécurisée du secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET_KEY }}
        run: |
          echo "Vérification du secret..."
          if [ -z "$MY_SECRET" ]; then
            echo "Erreur: Le secret MY_SECRET_KEY n'est pas défini dans GitHub !"
            exit 1
          else
            echo "Le secret est bien configuré et accessible dans la CI !"
          fi
